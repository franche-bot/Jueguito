<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pisos y Salas 3D</title>
<style>
:root{--bg:#e9e4d8;--fg:#221d2b;--pn:#fbf8f0;--ac:#c2410c;--ln:#cfc7b4;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14121a;--fg:#ece6d8;--pn:#231f2e;--ac:#f59e42;--ln:#3a3347;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14121a;--fg:#ece6d8;--pn:#231f2e;--ac:#f59e42;--ln:#3a3347;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:12px}
#wrap{position:relative;width:100%;max-width:800px}
#h{position:absolute;left:0;top:0;pointer-events:none;background:none!important;border-color:transparent!important}
canvas{width:100%;height:auto;display:block;border:3px solid var(--fg);border-radius:6px;background:#1b1826;touch-action:none}
#ov{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(14,11,20,.88);border-radius:6px;padding:10px;overflow:auto}
.pn{background:var(--pn);color:var(--fg);border:2px solid var(--fg);border-radius:6px;padding:18px;max-width:640px;width:100%;text-align:center}
h1,h2{margin:0 0 8px;font-family:Georgia,"Times New Roman",serif;font-weight:700}
p{margin:6px 0;line-height:1.45}
button{font:inherit;font-weight:700;cursor:pointer;background:var(--ac);color:#fff;border:2px solid var(--fg);border-radius:4px;padding:9px 16px;margin:4px}
button:disabled{opacity:.4;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:12px 0}
.it{background:var(--bg);border:2px solid var(--ln);border-radius:4px;padding:8px;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.it b{display:block}.it small{opacity:.75}
.st{font-size:.85rem;opacity:.85}
</style></head><body>
<div id="wrap"><canvas id="c" width="800" height="520" aria-label="Área de juego"></canvas><canvas id="h" width="800" height="520"></canvas><div id="ov"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const cv=document.getElementById('c'),ctx=document.getElementById('h').getContext('2d'),W=800,H=520,M=26,ov=document.getElementById('ov');
const ROOMS=7,FLOORS=5;
const rnd=(a,b)=>a+Math.random()*(b-a),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
let G=null,keys={},joy=null,last=0;
const POOL=[
{n:'Daño +3',d:'Más daño por bala',c:14,f:p=>p.dmg+=3},
{n:'Cadencia +15%',d:'Disparas más rápido',c:14,f:p=>p.rate*=1.15},
{n:'Velocidad +10%',d:'Te mueves más rápido',c:12,f:p=>p.spd*=1.1},
{n:'Vida máx +20',d:'Y te cura 20',c:12,f:p=>{p.max+=20;p.hp=Math.min(p.max,p.hp+20)}},
{n:'Alcance +40',d:'Disparas más lejos',c:10,f:p=>p.range+=40},
{n:'Bala extra',d:'+1 proyectil en abanico',c:38,f:p=>p.multi++},
{n:'Regeneración',d:'+0,5 vida por segundo',c:18,f:p=>p.regen+=.5},
{n:'Crítico +10%',d:'Los críticos hacen x2',c:14,f:p=>p.crit+=.1},
{n:'Botiquín',d:'Cura el 50% de tu vida',c:10,f:p=>p.hp=Math.min(p.max,p.hp+p.max*.5)}];
const T={grunt:{hp:20,s:55,r:9,d:6,col:'#e85d5d',g:1},runner:{hp:12,s:105,r:7,d:5,col:'#f0903c',g:1},
tank:{hp:70,s:35,r:15,d:10,col:'#8a5de8',g:3},shooter:{hp:18,s:40,r:9,d:5,col:'#4cc9b0',g:2},boss:{hp:450,s:45,r:28,d:12,col:'#d62f7a',g:4}};

function newGame(){
 G={floor:1,room:1,gold:0,mode:'play',t:0,msg:0,reroll:4,items:[],
 p:{x:W/2,y:H/2+60,hp:100,max:100,dmg:8,rate:2.5,spd:150,range:220,multi:1,regen:0,crit:.05,cd:0,inv:0}};
 startRoom();
}
function startRoom(){
 Object.assign(G,{E:[],B:[],EB:[],C:[],S:[],spawnT:.5,mode:'play',msg:1.6});makePools();buildTheme();
 G.p.x=W/2;G.p.y=H-70;
 const boss=G.room===ROOMS;
 G.queue=boss?5+G.floor:5+G.floor*2+G.room*2;
 if(boss)G.S.push({x:W/2,y:110,t:1.2,type:'boss'});
 ov.style.display='none';
}
function pickType(){const m=G.room,r=Math.random();if(m>=3&&r<.06+.02*m)return'tank';if(m>=2&&r<.22+.02*m)return'shooter';if(r<.5)return'runner';return'grunt';}
function addEnemy(type,x,y){
 const b=T[type],k=1+.3*(G.floor-1)+.1*(G.room-1);
 G.E.push({x,y,type,hp:b.hp*k,max:b.hp*k,s:b.s,r:b.r,d:b.d*(1+.1*(G.floor-1)),col:b.col,g:b.g,cd:rnd(1,2.5),fl:0});
}
function shopItems(){
 const a=[...POOL].sort(()=>Math.random()-.5).slice(0,4),k=1+.15*(G.floor-1)+.05*(G.room-1);
 G.items=a.map(i=>({...i,cost:Math.round(i.c*k),sold:false}));
}
function openShop(){
 G.mode='shop';shopItems();renderShop();
}
function renderShop(){
 const p=G.p,last=G.room===ROOMS,nxt=last?`Bajar al piso ${G.floor+1}`:`Ir a la sala ${G.room+1}`;
 ov.style.display='flex';
 ov.innerHTML=`<div class="pn"><h2>Tienda · Piso ${G.floor}, sala ${G.room} despejada</h2>
 <p>Monedas: <b>${G.gold}</b> · Vida ${Math.ceil(p.hp)}/${p.max}</p>
 <div class="g">${G.items.map((it,i)=>`<div class="it"><div><b>${it.n}</b><small>${it.d}</small></div>
 <button data-b="${i}" ${it.sold||G.gold<it.cost?'disabled':''}>${it.sold?'Comprado':it.cost+' monedas'}</button></div>`).join('')}</div>
 <p class="st">Daño ${p.dmg} · Cadencia ${p.rate.toFixed(1)}/s · Velocidad ${Math.round(p.spd)} · Alcance ${p.range} · Balas ${p.multi} · Regen ${p.regen}/s · Crítico ${Math.round(p.crit*100)}%</p>
 <button id="rr" ${G.gold<G.reroll?'disabled':''}>Renovar (${G.reroll})</button><button id="go">${nxt}</button></div>`;
 ov.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>{const it=G.items[+b.dataset.b];
  if(it.sold||G.gold<it.cost)return;G.gold-=it.cost;it.f(G.p);it.sold=true;renderShop();});
 document.getElementById('rr').onclick=()=>{if(G.gold<G.reroll)return;G.gold-=G.reroll;G.reroll+=2;shopItems();renderShop();};
 document.getElementById('go').onclick=()=>{
  if(G.room<ROOMS)G.room++;else{G.floor++;G.room=1;G.p.hp=Math.min(G.p.max,G.p.hp+G.p.max*.25);}
  G.reroll=4;startRoom();};
}
function endScreen(win){
 G.mode='end';ov.style.display='flex';
 ov.innerHTML=`<div class="pn"><h1>${win?'¡Saliste de la mazmorra!':'Has caído'}</h1>
 <p>${win?`Superaste los ${FLOORS} pisos.`:`Llegaste al piso ${G.floor}, sala ${G.room}.`} Monedas: ${G.gold}</p><button id="again">Jugar de nuevo</button></div>`;
 document.getElementById('again').onclick=newGame;
}
function menu(){
 ov.style.display='flex';
 ov.innerHTML=`<div class="pn"><h1>Pisos y Salas</h1>
 <p>Cinco presas de patos se rebelaron, una por piso: el jardín de gusanos, la laguna de libélulas, el bosque de caracoles, el pantano de ranas (el barro te frena) y la costa de cangrejos. Cada piso tiene su jefe. Despeja cada sala, compra mejoras en la tienda y baja al siguiente piso. Cada piso tiene ${ROOMS} salas; la última tiene jefe. ${FLOORS} pisos en total.</p>
 <p class="st">Mover: WASD o flechas (en móvil, arrastra el dedo). Disparas solo al enemigo más cercano.</p>
 <button id="st">Empezar</button></div>`;
 document.getElementById('st').onclick=newGame;
}

addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=1;if(e.key.startsWith('Arrow'))e.preventDefault();});
addEventListener('keyup',e=>keys[e.key.toLowerCase()]=0);
cv.addEventListener('pointerdown',e=>{joy={sx:e.clientX,sy:e.clientY,x:0,y:0};cv.setPointerCapture(e.pointerId);});
cv.addEventListener('pointermove',e=>{if(!joy)return;const dx=e.clientX-joy.sx,dy=e.clientY-joy.sy,l=Math.hypot(dx,dy)||1,m=Math.min(1,l/40);joy.x=dx/l*m;joy.y=dy/l*m;});
['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>joy=null));

function hurt(d){const p=G.p;if(p.inv>0)return;p.hp-=d;p.inv=.6;G.shake=.3;if(p.hp<=0)endScreen(false);}
function kill(e){
 const n=e.type==='boss'?5:1,v=e.type==='boss'?e.g:e.g;
 for(let i=0;i<n;i++)G.C.push({x:e.x+rnd(-8,8),y:e.y+rnd(-8,8),v,mag:false});
}
function update(dt){
 if(G.mode==='end'||G.mode==='shop')return;
 const p=G.p;G.t+=dt;if(G.msg>0)G.msg-=dt;
 if(G.mode==='play'||G.mode==='clear'){
  let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0);
  if(joy){dx+=joy.x;dy+=joy.y;}
  const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l;}
  p.x=Math.max(M,Math.min(W-M,p.x+dx*p.spd*slowF()*dt));p.y=Math.max(M,Math.min(H-M,p.y+dy*p.spd*slowF()*dt));
  p.inv-=dt;p.hp=Math.min(p.max,p.hp+p.regen*dt);
  p.cd-=dt;
  let tg=null,bd=p.range;for(const e of G.E){const d=dist(e,p);if(d<bd){bd=d;tg=e;}}
  if(tg&&p.cd<=0){
   p.cd=1/p.rate;const a=Math.atan2(tg.y-p.y,tg.x-p.x);
   for(let i=0;i<p.multi;i++){const q=a+(i-(p.multi-1)/2)*.16,c=Math.random()<p.crit;
    G.B.push({x:p.x,y:p.y,vx:Math.cos(q)*430,vy:Math.sin(q)*430,dmg:p.dmg*(c?2:1),life:p.range/430,c});}
  }
 }
 // spawns
 if(G.mode==='play'){
  G.spawnT-=dt;
  if(G.queue>0&&G.spawnT<=0&&G.E.length+G.S.length<7+G.floor*2){
   G.spawnT=.55;G.queue--;let x,y;
   do{x=rnd(M+20,W-M-20);y=rnd(M+20,H-M-20);}while(Math.hypot(x-p.x,y-p.y)<170);
   G.S.push({x,y,t:.8,type:pickType()});
  }
 }
 for(const s of G.S)s.t-=dt;
 G.S=G.S.filter(s=>{if(s.t<=0){addEnemy(s.type,s.x,s.y);return false;}return true;});
 // bullets
 for(const b of G.B){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
  for(const e of G.E)if(b.life>0&&Math.hypot(e.x-b.x,e.y-b.y)<e.r+4){e.hp-=b.dmg;e.fl=.08;b.life=0;}
  if(b.x<M||b.x>W-M||b.y<M||b.y>H-M)b.life=0;}
 G.B=G.B.filter(b=>b.life>0);
 // enemies
 for(const e of G.E){
  e.fl-=dt;const d=dist(e,p),a=Math.atan2(p.y-e.y,p.x-e.x);
  let sp=e.s;if(e.type==='shooter'&&d<190)sp=-e.s*.8;
  e.x+=Math.cos(a)*sp*dt;e.y+=Math.sin(a)*sp*dt;
  e.x=Math.max(M,Math.min(W-M,e.x));e.y=Math.max(M,Math.min(H-M,e.y));
  e.cd-=dt;
  if(e.type==='shooter'&&e.cd<=0){e.cd=2;G.EB.push({x:e.x,y:e.y,vx:Math.cos(a)*150,vy:Math.sin(a)*150,dmg:8,life:4});}
  if(e.type==='boss'&&e.cd<=0){const f=G.floor,aim=Math.atan2(p.y-e.y,p.x-e.x);e.cd=[2.2,1.4,2.8,1.9,1.7][f-1];e.k=(e.k||0)+1;
   const ring=n=>{const o=rnd(0,6.28);for(let i=0;i<n;i++){const q=o+i*6.283/n;G.EB.push({x:e.x,y:e.y,vx:Math.cos(q)*130,vy:Math.sin(q)*130,dmg:9,life:5});}};
   const fan=(n,v)=>{for(let i=0;i<n;i++){const q=aim+(i-(n-1)/2)*.2;G.EB.push({x:e.x,y:e.y,vx:Math.cos(q)*v,vy:Math.sin(q)*v,dmg:8,life:4});}};
   if(f===1)ring(10);else if(f===2)fan(5,190);else if(f===3)ring(16);else if(f===4){if(e.k%2)fan(3,170);else ring(8);}else fan(7,150);}
  if(d<e.r+9)hurt(e.d);
  if(e.hp<=0){kill(e);e.dead=true;}
 }
 G.E=G.E.filter(e=>!e.dead);
 for(const b of G.EB){b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(Math.hypot(b.x-p.x,b.y-p.y)<10){hurt(b.dmg);b.life=0;}
  if(b.x<M||b.x>W-M||b.y<M||b.y>H-M)b.life=0;}
 G.EB=G.EB.filter(b=>b.life>0);
 // coins
 for(const c of G.C){const d=dist(c,p);if(d<75||G.mode==='clear')c.mag=true;
  if(c.mag){const a=Math.atan2(p.y-c.y,p.x-c.x);c.x+=Math.cos(a)*320*dt;c.y+=Math.sin(a)*320*dt;}
  if(d<12){G.gold+=c.v;c.got=true;}}
 G.C=G.C.filter(c=>!c.got);
 // clear
 if(G.mode==='play'&&G.queue===0&&!G.E.length&&!G.S.length){G.mode='clear';G.clr=1.4;G.EB=[];}
 if(G.mode==='clear'){G.clr-=dt;
  if(G.clr<=0&&!G.C.length||G.clr<-1.5){
   if(G.room===ROOMS&&G.floor===FLOORS)endScreen(true);else openShop();}}
}

/* ===== Entorno 3D (Three.js) + personajes como sprites 2D ===== */
const R=new THREE.WebGLRenderer({canvas:cv,antialias:true});
R.setPixelRatio(Math.min(devicePixelRatio||1,2));R.setSize(W,H,false);
const sc=new THREE.Scene();sc.background=new THREE.Color(0x120f1a);sc.fog=new THREE.Fog(0x120f1a,32,64);

sc.add(new THREE.AmbientLight(0x9a88c0,.8));

const torch=new THREE.PointLight(0xffc27a,1.2,24,1.4);sc.add(torch);
// suelo
const fc=document.createElement('canvas');fc.width=fc.height=128;const fx=fc.getContext('2d');
[['#3b3350','#332c46'],['#332c46','#3b3350']].forEach((r,j)=>r.forEach((c,i)=>{fx.fillStyle=c;fx.fillRect(i*64,j*64,64,64);fx.strokeStyle='#241e33';fx.lineWidth=3;fx.strokeRect(i*64+1,j*64+1,62,62);}));
const ft=new THREE.CanvasTexture(fc);ft.wrapS=ft.wrapT=THREE.RepeatWrapping;ft.repeat.set(10,6.5);ft.anisotropy=4;
const floor=new THREE.Mesh(new THREE.PlaneGeometry(40,26),new THREE.MeshLambertMaterial({map:ft}));floor.rotation.x=-Math.PI/2;sc.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(5,5.4,48),new THREE.MeshBasicMaterial({color:0x5a4a80}));ring.rotation.x=-Math.PI/2;ring.position.y=.02;sc.add(ring);
// paredes, puerta y pilares con antorchas
const wm=new THREE.MeshLambertMaterial({color:0x5a4d78});
function box(w,h,d,x,y,z,m){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m||wm);b.position.set(x,y,z);sc.add(b);return b;}

const door=new THREE.Mesh(new THREE.CylinderGeometry(2.2,2.2,.12,24),new THREE.MeshLambertMaterial({color:0x2a2438}));door.position.set(0,.07,-10.8);sc.add(door);
const flames=[];
[-19,19].forEach(x=>{box(.4,2.4,.4,x,1.2,-12);
 const f=new THREE.Mesh(new THREE.SphereGeometry(.45,10,8),new THREE.MeshBasicMaterial({color:0xffa23a}));f.position.set(x,2.7,-12);sc.add(f);
 const l=new THREE.PointLight(0xff9a3a,.9,20,1.4);l.position.set(x,3,-11);sc.add(l);flames.push([f,l]);});

class Px{
 constructor(w,h){this.w=w;this.h=h;this.d=new Array(w*h).fill(null);}
 fill(f,r){const{w,h}=this,k=new Uint8Array(w*h);for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(f(x+.5,y+.5))k[y*w+x]=1;

  for(let y=0;y<h;y++)for(let x=0;x<w;x++)if(k[y*w+x])this.d[y*w+x]=(!g(x,y+1)||!g(x+1,y))?r[0]:(!g(x-1,y)||!g(x,y-1))?r[3]:(!g(x-2,y-2)||!g(x-1,y-1))?r[2]:r[1];return this;}
 ell(cx,cy,rx,ry,r){return this.fill((x,y)=>((x-cx)/rx)**2+((y-cy)/ry)**2<=1,r);}
 rect(x0,y0,w,h,r){return this.fill((x,y)=>x>=x0&&x<x0+w&&y>=y0&&y<y0+h,r);}
 line(x0,y0,x1,y1,t,r){const dx=x1-x0,dy=y1-y0,l=dx*dx+dy*dy||1;return this.fill((x,y)=>{const u=Math.max(0,Math.min(1,((x-x0)*dx+(y-y0)*dy)/l));return Math.hypot(x-(x0+u*dx),y-(y0+u*dy))<=t/2;},r);}
 poly(p,r){return this.fill((x,y)=>{let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++)if((p[i][1]>y)!==(p[j][1]>y)&&x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0])c=!c;return c;},r);}
 blade(P,w0,r){const A=[],B=[];for(let i=0;i<=8;i++){const u=i/8,a=P(u),b=P(Math.min(1,u+.02)),c=P(Math.max(0,u-.02)),dx=b[0]-c[0],dy=b[1]-c[1],l=Math.hypot(dx,dy)||1,w=w0*(1-u*.85)+.4;A.push([a[0]-dy/l*w,a[1]+dx/l*w]);B.push([a[0]+dy/l*w,a[1]-dx/l*w]);}return this.poly(A.concat(B.reverse()),r);}
 dot(x,y,c){if(x>=0&&y>=0&&x<this.w&&y<this.h)this.d[y*this.w+x]=c;return this;}
 out(){const{w,h}=this,S=Math.max(w,h)+2,cv=document.createElement('canvas');cv.width=cv.height=S;const g=cv.getContext('2d'),ox=Math.floor((S-w)/2),oy=S-h-1,a=(x,y)=>x>=0&&y>=0&&x<w&&y<h&&this.d[y*w+x];
  for(let y=-1;y<=h;y++)for(let x=-1;x<=w;x++){const c=a(x,y);if(c){g.fillStyle=c;g.fillRect(ox+x,oy+y,1,1);}else if(a(x+1,y)||a(x-1,y)||a(x,y+1)||a(x,y-1)){g.fillStyle=OUT;g.fillRect(ox+x,oy+y,1,1);}}
